<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Keyboard · randomOrder</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@arco-design/mobile-react@2.39.1/dist/style.min.css">
  <style>
    html {font-size:50px} body {font:16px/1.45 -apple-system,Roboto,sans-serif; color:#1d2129; background:#fff}
    main {max-width:560px; margin:auto; padding:24px 18px} h1 {font-size:22px; margin:0 0 6px}
    p {margin:0 0 16px} main button {font-size:16px; padding:11px 16px; margin:0 8px 8px 0; border:1px solid #a4afbe; border-radius:6px; background:white}
    .mode-title {font-size:16px; text-align:center; padding:3px 0 10px}
  </style>
</head>
<body><div id="build-id" style="padding:3px 14px 0;font:13px/1.5 monospace;color:#384353"></div>
  <div id="root"></div><div style="padding:0 20px"><div id="run-id"></div><pre id="log"></pre></div>
  <script src="https://cdn.jsdelivr.net/npm/react@16.14.0/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@16.14.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-transition-group@4.4.2/dist/react-transition-group.min.js"></script>
  <script src="component-ef36d7b6dedcb7befb9b329e123a7720b98b2a1d.js"></script>
  <script>
    const h = React.createElement;
    function Demo() {
      const [mode, setMode] = React.useState(null);
      const random = mode === 'random';
      return h(React.Fragment, null,
        h('main', null,
          h('h1', null, '数字键盘'),
          h('p', null, '依次打开普通、随机、普通键盘。每次用键盘左下角的收起键关闭'),
          h('button', {id:'normal', onClick:() => setMode('normal')}, '打开普通键盘'),
          h('button', {id:'random', onClick:() => setMode('random')}, '打开随机键盘')
        ),
        mode && h(Arco.Keyboard, {
          visible: true, randomOrder: random, close: () => setMode(null),
          title: h('div', {className:'mode-title'}, random ? '随机键盘' : '普通键盘')
        })
      );
    }
    ReactDOM.render(h(Demo), document.getElementById('root'));
    const run = Array.from(crypto.getRandomValues(new Uint8Array(4)), n=>n.toString(16).padStart(2,'0')).join('');
    document.querySelector('#run-id').textContent='Run '+run;
    let previous=null, stage=0; const start=performance.now();
    function readKeyboard(){
      const node=document.querySelector('.arco-keyboard');
      if(node && previous!==node){
        const keys=Array.from(node.querySelectorAll('button'));
        if(keys.length===12){
          const digits=keys.map(k=>k.textContent.trim()).filter(s=>/^\d$/.test(s)).join('');
          const mode=node.querySelector('.mode-title').textContent;
          const ms=Number((performance.now()-start).toFixed(1));
          ++stage; previous=node;
          console.log(mode,{ms,stage,digits});
          document.querySelector('#log').append(document.createTextNode(`+${ms} ms  ${mode}\n  stage=${stage} digits=${digits}\n`));
          document.documentElement.dataset.stage=stage;
          document.documentElement.dataset.order=digits;
          if(stage===3)document.documentElement.dataset.complete='true';
        }
      }
      if(!node)previous=null;
      if(stage<3)requestAnimationFrame(readKeyboard);
    }
    requestAnimationFrame(readKeyboard);
  </script>
<script>
if(window.__arcoTestBuild !== 'ef36d7b6dedcb7befb9b329e123a7720b98b2a1d') throw new Error('组件版本不一致');
document.getElementById('build-id').textContent='#407 · '+window.__arcoTestBuild.slice(0,10);
</script></body>
</html>
